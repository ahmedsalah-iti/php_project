<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            background-color: #007bff;
            color: #fff;
            padding: 20px 0;
            text-align: center;
        }
        .header .logo {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .login-container {
            max-width: 800px; /* Increased width */
            margin: auto;
            padding: 40px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 0 20px #007bff22;
            flex: 0 1 auto;
            width: 40%;
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #007bff;
        }
        .form-group {
            position: relative;
            margin-bottom: 25px;
        }

      .form-control {
        width: 100%;
        height: 50px;
        padding: 10px 20px 10px 50px;
        font-size: 1rem;
        border-radius: 10px;
        border: 1px solid #ced4da;
        transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        /* Placeholder Animation Styles */
        position: relative; /* Important for placeholder positioning */
    }

      .form-control:focus {
          border-color: #007bff;
          box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
          outline: none;
      }
      .form-control::placeholder{
          transition: transform 0.3s ease, opacity 0.3s ease;

      }
        /* Placeholder Animation */
      .form-control:focus::placeholder {
        transform: translateY(-150%); /* Move placeholder up */
        opacity: 0; /* Fade out placeholder */
        transition: transform 0.4s ease, opacity 0.4s ease;
      }

        .form-group i {
            position: absolute;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            color: rgba(0, 123, 255, 0.5);
            z-index: 2;
            pointer-events: none;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            border: none;
            color: #fff;
            border-radius: 10px;
            font-size: 1.2rem;
            transition: background-color 0.3s ease, transform 0.2s ease, opacity 0.3s ease; /* Added opacity transition */
            cursor: pointer;
        }
        .btn-login:hover:not(:disabled) { /* Only hover when not disabled */
            background-color: #0056b3;
            transform: translateY(-2px);
        }
        .btn-login:disabled {
          opacity: 0.65; /* Reduce opacity when disabled */
          cursor: default; /* Change cursor to default */
      }


        .register-link, .forgot-password-link {
          text-align: center;
          margin-top: 15px;
      }
        .register-link a, .forgot-password-link a {
            color: #007bff;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .register-link a:hover , .forgot-password-link a:hover{
            text-decoration: underline;
            color: #0056b3;
        }

        .footer {
            background-color: #007bff;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            margin-top: auto;
        }
       .alert-box {
           position: fixed;
           top: 20px;
           right: 20px;
           z-index: 1000;
       }
       .alert-success {
           background-color: #d4edda;
           border-color: #c3e6cb;
           color: #155724;
       }

       .alert-danger {
           background-color: #f8d7da;
           border-color: #f5c6cb;
           color: #721c24;
       }

       @keyframes fadeInUp {
           from {
               opacity: 0;
               transform: translateY(20px);
           }
           to {
               opacity: 1;
               transform: translateY(0);
           }
       }

       .form-group, .btn-login, .register-link ,.forgot-password-link{
           animation: fadeInUp 0.5s ease forwards;
           animation-delay: 0.2s; /* Staggered animation */
       }
       .btn-login {
         animation-delay: 0.4s; /* Button animates slightly later */
       }


    </style>
</head>
<body>

<script>
    const token = localStorage.getItem('token');
    if (token) {
        window.location.href = '/dashboard.html'; // Redirect to dashboard if logged in
    }
</script>

<header class="header">
    <div class="logo">Cafeteria</div>
</header>

<div class="login-container">
    <h2>Login</h2>
    <form id="loginForm">
        <div class="form-group">
            <i class="fas fa-envelope"></i>
            <input type="email" class="form-control" id="email" placeholder="Enter email" required>
        </div>

        <div class="form-group">
            <i class="fas fa-lock"></i>
            <input type="password" class="form-control" id="password" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn btn-login">Login</button>
        <hr>
        <div class="register-link">
            Don't have an account? <a href="/register.html">Register</a>
        </div>
        <div class="forgot-password-link">
          forget password ? <a href="/fp.html">Forget Password</a>
        </div>
    </form>
</div>

<footer class="footer">
    <p>&copy; 2025 Cafeteria. All rights reserved.</p>
</footer>

<div id="notification" class="toast alert-box" role="alert" aria-live="assertive" aria-atomic="true" style="display: none;">
  <div class="toast-header">
    <strong class="me-auto">Notification</strong>
    <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
  </div>
  <div class="toast-body" id="notification-message"></div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>

<script>
    function showNotification(message, type) {
      const notification = document.getElementById('notification');
      const notificationMessage = document.getElementById('notification-message');
      notification.style.display = 'block';

      const toastBody = notification.querySelector('.toast-body');
      toastBody.classList.remove('alert-success', 'alert-danger', 'alert-primary');

      if (type === 'success') {
          toastBody.classList.add('alert-success');
      } else if (type === 'danger') {
          toastBody.classList.add('alert-danger');
      } else {
          toastBody.classList.add('alert-primary');
      }

      notificationMessage.textContent = message;

      const toast = new bootstrap.Toast(notification)
      toast.show()
  }

    document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const loginButton = this.querySelector('.btn-login');

        loginButton.disabled = true;
        loginButton.textContent = 'Logging in...';


        const data = {
            type: "email",
            email: email,
            pass: password
        };

        fetch('./login.php', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
        .then(response => {
          if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
          }
          return response.json();
        })
        .then(response => {

            if (response.status === 'success') {
                localStorage.setItem('token', response.data.token);
                localStorage.setItem('user', JSON.stringify(response.data));
                showNotification(response.message, 'success');

                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 2000);
            } else {
               showNotification(response.message, 'danger');
               loginButton.disabled = false;
               loginButton.textContent = 'Login';
            }
        })
        .catch(error => {
            console.error('Error:', error);
           showNotification('An error occurred during login.', 'danger');
            loginButton.disabled = false;
            loginButton.textContent = 'Login';
        }).finally(() => {
            //Keep it disabled until redirect to dashboard
            if (!localStorage.getItem('token')){
                setTimeout(() => {
                  loginButton.disabled = false;
                  loginButton.textContent = 'Login';
             }, 3000);
            }

        });
    });
</script>

</body>
</html>
