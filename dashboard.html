<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.discordapp.com/attachments/1064723909934596097/1120776837300232232/theme_custom.css?ex=67b96985&is=67b81805&hm=c301d7967ef412270bb069f7d3d3cd93e476a526efc5c427e97d392439257969&" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            background-color: #007bff;
            color: #fff;
            padding: 10px 0;
            text-align: center;
        }
        .logo {
            font-size: 4rem;
            font-weight: bold;
        }
        .dashboard-container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 0 20px #007bff22;
            flex: 1;
            width: 50%;
            transition: width 0.3s;
        }
        @media (max-width: 991px) {
            .dashboard-container {
                width: 90%;
            }
        }
        .button-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-top: 20px;
    transition: all 0.3s ease;
}

.button-container > button:last-child:nth-child(odd) {
    grid-column: span 2; /* Make the last button take full width if it's alone */
}

@media (max-width: 767px) {
    .button-container {
        grid-template-columns: repeat(1, 1fr);
    }
}

.button-container button {
    transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
}

.button-container button:hover {
    transform: translateY(-3px);
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
}

        .user-info {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            text-align: center;
            padding: 15px;
            background: #e9ecef;
            border-radius: 10px;
            margin-top: 20px;
              transition: all 0.3s ease;
        }
        @media (max-width: 991px) {
            .user-info {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 767px) {
            .user-info {
                grid-template-columns: repeat(1, 1fr);
            }
        }
        .user-info p {
            background: #fff;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

         .user-info p i {
           position: absolute;
           top: 50%;
           left: 50%;
           transform: translate(-50%, -50%);
           font-size: 3em;
           color: rgba(0, 123, 255, 0.2);
           z-index: 1;
           pointer-events: none;
         }

        .user-info p span {
            position: relative;
            z-index: 2;
        }

      .profile-img-container {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        margin: 1px auto;
        cursor: pointer;
        overflow: hidden;
        transition: transform 0.3s ease;  /* Transition for the scale effect */
        position: relative;

        /* New Border Styles */
        border: 2px solid #007bff; /* Solid primary color border */
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5); /* Subtle glow */
    }

    /* Hover effect: scale and slightly increase shadow */
    .profile-img-container:hover {
        transform: scale(1.1);
        box-shadow: 0 0 10px rgba(0, 123, 255, 0.7); /* Increased glow on hover */
    }

      .profile-img-container::before {
          content: '\f030';
          font-family: 'Font Awesome 6 Free';
          font-weight: 900;
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background-color: rgba(0, 0, 0, 0.5);
          color: white;
          display: flex;
          justify-content: center;
          align-items: center;
          opacity: 0;
          transition: opacity 0.3s ease;
          pointer-events: none;
      }
        .profile-img-container:hover::before {
            opacity: 1;
      }

      .profile-img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
          transition: opacity 0.4s ease; /* Transition for opacity */
          pointer-events: auto;
          opacity: 0; /* Initially hidden */

      }
        .profile-img.loaded {
          opacity: 1; /* Visible when loaded */
        }


        .footer {
            background-color: #007bff;
            color: #fff;
            text-align: center;
            padding: 5px 0;
            margin-top: auto;
        }

        #notification {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: none;
        }

        .alert-success {
            background-color: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }

        .alert-danger {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
        .dashboard-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 20px;
        }

        .dashboard-title {
          font-size: 1.6rem;
          margin: 0;
        }

        .user-name {
            font-size: 1.6rem;
            color: #007bff;
            font-weight: bold;

        }


    </style>

</head>
<body>
    <div id="notification" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="toast-header">
          <strong class="me-auto">Notification</strong>
          <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
      <div class="toast-body" id="notification-message">

      </div>
    </div>

    <header class="header">
        <div class="logo">Cafeteria</div>
    </header>
    <div class="dashboard-container">
       <div class="dashboard-header">
          <h1 class="dashboard-title"><i class="fas fa-tachometer-alt"></i> Dashboard</h1>
          <span id="user-name" class="user-name"></span>
        </div>
        <div class="profile-img-container">
            <img id="profile-img" class="profile-img" src="./uploads/empty.jpg" alt="Profile Picture">
        </div>
        <input type="file" id="profile-upload" style="display: none;" accept="image/*">
        <div class="user-info">
            <p><i class="fas fa-envelope"></i> <span id="user-email"></span></p>
            <p><i class="fas fa-phone"></i> <span id="user-phone"></span></p>
            <p><i class="fas fa-building"></i> <span id="user-room"></span></p>
            <p><i class="fas fa-user-tag"></i> <span id="user-role"></span></p>
            <p><i class="fas fa-wallet"></i> <span id="user-balance">265.65 L.E</span></p>
        </div>
        <div class="button-container">
            <button id="admin-btn" class="btn btn-success" onclick="window.location.href='admin.html'" style="display: none;"><i class="fas fa-tools"></i> Admin Panel</button>
            <button id="make-new-order-btn" class="btn btn-success"><i class="fas fa-plus-circle"></i> Make New Order</button>
            <button id="change-profile-btn" class="btn btn-primary"><i class="fas fa-image"></i> Change Profile Picture</button>
            <button id="change-password-btn" class="btn btn-info" onclick="window.location.href='change-password.html'"><i class="fas fa-key"></i> Change Password</button>
            <button id="my-orders-btn" class="btn btn-warning"><i class="fas fa-shopping-cart"></i> My Orders</button>
            <button id="history-btn" class="btn btn-secondary"><i class="fas fa-history"></i> History</button>
            <button id="wallet-transactions-btn" class="btn btn-dark"><i class="fas fa-wallet"></i> Wallet Transactions</button>
            <button id="logout-btn" class="btn btn-danger"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </div>
    <footer class="footer">
        <p>&copy; 2025 Cafeteria. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
       const token = localStorage.getItem('token');
        let user = JSON.parse(localStorage.getItem('user'));

        if (!token || !user) {
            window.location.href = '/login.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
             if (user && user.profile_img) {
                const profileImg = document.getElementById('profile-img');
                profileImg.src = user.profile_img;
                // Add 'loaded' class after the image is loaded
                profileImg.onload = () => {
                   profileImg.classList.add('loaded');
                }
            }
             // Set user's name
            const userNameElement = document.getElementById('user-name');
            if (user && user.first_name && user.last_name) {
              userNameElement.textContent = `${user.first_name} ${user.last_name}`;
            }
        });


        document.getElementById('user-email').textContent = user.email;
        document.getElementById('user-phone').textContent = user.phone;
       document.getElementById('user-room').textContent = user.room_name;
        document.getElementById('user-role').textContent = user.role;


        if (user.role === 'admin') {
            document.getElementById('admin-btn').style.display = 'block';
        }

        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login.html';
        });

        const profileImg = document.getElementById('profile-img');
        const profileUpload = document.getElementById('profile-upload');
        const changeProfileBtn = document.getElementById('change-profile-btn');

        // Trigger file input when profile image or button is clicked
        profileImg.addEventListener('click', () => profileUpload.click());
        changeProfileBtn.addEventListener('click', () => profileUpload.click());

        // Handle file upload
        function handleFileUpload() {
             const file = profileUpload.files[0];
              if (file) {
                  uploadImage(file);
              }
              // Clear the input after upload (fixes the same-file issue)
                profileUpload.value = '';
        }

        profileUpload.addEventListener('change', handleFileUpload);

        function showNotification(message, type) {
          const notification = document.getElementById('notification');
          const notificationMessage = document.getElementById('notification-message');
          notification.style.display = 'block';

          const toastBody = notification.querySelector('.toast-body');
          toastBody.classList.remove('alert-success', 'alert-danger', 'alert-primary');

          if (type === 'success') {
              toastBody.classList.add('alert-success');
          } else if (type === 'danger') {
              toastBody.classList.add('alert-danger');
          } else {
              toastBody.classList.add('alert-primary');
          }


          notificationMessage.textContent = message;

          const toast = new bootstrap.Toast(notification)
          toast.show()
      }

        function uploadImage(file) {
            const formData = new FormData();
            formData.append('profile_img', file);

            fetch('./upload.php', {
                method: 'POST',
                headers: {
                    'AUTHORIZATION': token
                },
                body: formData
            })
            .then(response => {
                if (!response.ok) {
                  throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
             })
            .then(data => {
                if (data.status === 'success') {
                    showNotification(data.message, 'success');

                    // Set the image source and add 'loaded' class after it loads
                    profileImg.src = data.url || URL.createObjectURL(file);
                    profileImg.onload = () => {
                        profileImg.classList.add('loaded');
                    };


                    if (data.data && data.data.profile_img) {
                        user.profile_img = data.data.profile_img;
                        localStorage.setItem('user', JSON.stringify(user));
                    } else if (data.url) {
                        user.profile_img = './uploads/empty.jpg';

                        // user.profile_img = data.url;
                        localStorage.setItem('user', JSON.stringify(user));
                    }


                } else {
                    showNotification(data.message, 'danger');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showNotification('An error occurred during upload.', 'danger');
            });
        }
        document.addEventListener("DOMContentLoaded", function () {
    let container = document.querySelector(".button-container");
    let buttons = [...container.children].filter(btn => window.getComputedStyle(btn).display !== "none"); // Get only visible buttons

    if (buttons.length % 2 !== 0) { // If the last row has one button
        buttons[buttons.length - 1].style.gridColumn = "span 2"; // Make it full width
    }
});

    </script>
</body>
</html>
