<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <style>
    .profile-img-upload {
      cursor: pointer;
    }
    .profile-img-upload:hover {
      opacity: 0.8;
    }
    .hidden-input {
      display: none;
    }
  </style>
</head>
<body class="bg-gray-100">
  <div class="container mx-auto p-4">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-gray-800">Admin Panel</h1>
      <button id="logout" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Logout</button>
    </div>

    <div class="bg-white shadow rounded-lg p-6">
      <button id="addMemberBtn" class="bg-blue-500 text-white px-4 py-2 rounded mb-4 hover:bg-blue-600">
        <i class="fas fa-plus mr-2"></i>Add Member
      </button>

      <div id="addMemberForm" class="hidden mb-6">
        <h2 class="text-xl font-semibold mb-4">Add New Member</h2>
        <form id="registerForm" class="space-y-4">
          <div>
            <label class="block text-gray-700">First Name</label>
            <input type="text" name="first_name" class="w-full px-4 py-2 border rounded" required>
          </div>
          <div>
            <label class="block text-gray-700">Last Name</label>
            <input type="text" name="last_name" class="w-full px-4 py-2 border rounded" required>
          </div>
          <div>
            <label class="block text-gray-700">Phone</label>
            <input type="text" name="phone" class="w-full px-4 py-2 border rounded" required>
          </div>
          <div>
            <label class="block text-gray-700">Email</label>
            <input type="email" name="email" class="w-full px-4 py-2 border rounded" required>
          </div>
          <div>
            <label class="block text-gray-700">Password</label>
            <input type="password" name="password" class="w-full px-4 py-2 border rounded" required>
          </div>
          <div>
            <label class="block text-gray-700">Role</label>
            <select name="role" class="w-full px-4 py-2 border rounded" required>
              <option value="admin">Admin</option>
              <option value="customer">Customer</option>
            </select>
          </div>
          <div>
            <label class="block text-gray-700">Room</label>
            <select name="room_id" class="w-full px-4 py-2 border rounded" required></select>
          </div>
          <!-- <div>
            <label class="block text-gray-700">Profile Image</label>
            <input type="file" name="profile_img" class="w-full px-4 py-2 border rounded" accept="image/*">
          </div> -->
          <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Register Member</button>
        </form>
      </div>

      <div id="membersTable">
        <h2 class="text-xl font-semibold mb-4">Members List</h2>
        <div class="overflow-x-auto">
          <table class="w-full table-auto">
            <thead>
              <tr class="bg-gray-200">
                <th class="px-4 py-2">Profile</th>
                <th class="px-4 py-2">First Name</th>
                <th class="px-4 py-2">Last Name</th>
                <th class="px-4 py-2">Phone</th>
                <th class="px-4 py-2">Email</th>
                <th class="px-4 py-2">Role</th>
                <th class="px-4 py-2">Room</th>
                <th class="px-4 py-2">Actions</th>
              </tr>
            </thead>
            <tbody id="membersList"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="notification" class="fixed bottom-4 right-4 hidden">
      <div class="bg-green-500 text-white px-4 py-2 rounded shadow-lg">
        <span id="notificationMessage"></span>
      </div>
    </div>
  </div>

  <script>
    // Admin Check
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user'));
    if (!token || !user || user.role !== 'admin') {
      window.location.href = '/login.html';
    }

    // DOM Elements
    const addMemberBtn = document.getElementById('addMemberBtn');
    const addMemberForm = document.getElementById('addMemberForm');
    const membersList = document.getElementById('membersList');
    const registerForm = document.getElementById('registerForm');
    const notification = document.getElementById('notification');
    const notificationMessage = document.getElementById('notificationMessage');
    const logoutButton = document.getElementById('logout');

    // Global Variables
    let roomsData = []; // Store rooms data globally

    // Helper Functions
    const showNotification = (message, type = 'success') => {
      notificationMessage.textContent = message;
      notification.className = `fixed bottom-4 right-4 px-4 py-2 rounded shadow-lg ${type === 'success' ? 'bg-green-500' : 'bg-red-500'} text-white`;
      notification.classList.remove('hidden');
      setTimeout(() => notification.classList.add('hidden'), 3000);
    };

    // Fetch Rooms
    const fetchRooms = async () => {
      try {
        const response = await fetch('getRooms.php');
        let data = await response.json();
        console.log('Rooms Response:', data); // Debugging: Log the response

        if (data.status === 'success') {
            data=data['data'];
          roomsData = data; // Store rooms data globally
          populateRoomDropdown(); // Populate the room dropdown in the "Add Member" form
        } else {
          showNotification(data.message || 'Failed to fetch rooms', 'error');
        }
      } catch (error) {
        console.error('Fetch Rooms Error:', error); // Debugging: Log the error
        showNotification('Failed to fetch rooms: ' + error.message, 'error');
      }
    };

    // Populate Room Dropdown
    const populateRoomDropdown = () => {
      const roomSelect = registerForm.querySelector('select[name="room_id"]');
      roomSelect.innerHTML = ''; // Clear existing options

      // Loop through the rooms and create options
      for (const key in roomsData) {
        if (roomsData[key].id && roomsData[key].name) {
          const option = document.createElement('option');
          option.value = roomsData[key].id; // Set value to room ID
          option.textContent = roomsData[key].name; // Set display text to room name
          roomSelect.appendChild(option);
        }
      }
    };

    // Fetch Members
    const fetchMembers = async () => {
      try {
        const response = await fetch('getMembers.php', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await response.json();

        console.log('Members Response:', data); // Debugging: Log the response

        if (data.status === 'success') {
          membersList.innerHTML = data.all_members_data.map(member => `
            <tr class="border-b" data-member-id="${member.id}">
              <td class="px-4 py-2">
                <img src="${member.profile_img || './uploads/empty.jpg'}" alt="Profile" class="w-10 h-10 rounded-full profile-img-upload" data-member-id="${member.id}">
                <input type="file" class="hidden-input" data-member-id="${member.id}" accept="image/*">
              </td>
              <td class="px-4 py-2"><input type="text" value="${member.first_name}" class="w-full px-2 py-1 border rounded" data-field="first_name" data-member-id="${member.id}"></td>
              <td class="px-4 py-2"><input type="text" value="${member.last_name}" class="w-full px-2 py-1 border rounded" data-field="last_name" data-member-id="${member.id}"></td>
              <td class="px-4 py-2"><input type="text" value="${member.phone}" class="w-full px-2 py-1 border rounded" data-field="phone" data-member-id="${member.id}"></td>
              <td class="px-4 py-2"><input type="email" value="${member.email}" class="w-full px-2 py-1 border rounded" data-field="email" data-member-id="${member.id}"></td>
              <td class="px-4 py-2">
                <select class="w-full px-2 py-1 border rounded" data-field="role" data-member-id="${member.id}">
                  <option value="admin" ${member.role === 'admin' ? 'selected' : ''}>Admin</option>
                  <option value="customer" ${member.role === 'customer' ? 'selected' : ''}>Customer</option>
                </select>
              </td>
              <td class="px-4 py-2">
                <select class="w-full px-2 py-1 border rounded" data-field="room_id" data-member-id="${member.id}">
                  ${generateRoomOptions(roomsData, member.room_id)}
                </select>
              </td>
              <td class="px-4 py-2">
                <button onclick="updateMember(${member.id})" class="bg-blue-500 text-white px-2 py-1 rounded hover:bg-blue-600 mr-2">Update</button>
                <button onclick="deleteMember(${member.id})" class="bg-red-500 text-white px-2 py-1 rounded hover:bg-red-600">Delete</button>
              </td>
            </tr>
          `).join('');
          addImageUploadListeners(); // Call the function after rendering the table
        } else {
          if (data.message === "invalid access token / unauthorized") {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login.html';
          }
          showNotification(data.message || 'Failed to fetch members', 'error');
        }
      } catch (error) {
        console.error('Fetch Members Error:', error); // Debugging: Log the error
        showNotification('Failed to fetch members: ' + error.message, 'error');
      }
    };

    // Generate Room Options
    const generateRoomOptions = (rooms, selectedRoomId) => {
      if (!rooms) return '';
      return Object.values(rooms).map(room => `
        <option value="${room.id}" ${room.id === selectedRoomId ? 'selected' : ''}>${room.name}</option>
      `).join('');
    };

    // Add Image Upload Listeners
    const addImageUploadListeners = () => {
      membersList.addEventListener('click', (event) => {
        if (event.target.classList.contains('profile-img-upload')) {
          const memberId = event.target.dataset.memberId;
          const fileInput = document.querySelector(`input.hidden-input[data-member-id="${memberId}"]`);
          if (fileInput) fileInput.click();
        }
      });

      document.querySelectorAll('.hidden-input').forEach(input => {
        input.addEventListener('change', async (event) => {
          const memberId = event.target.dataset.memberId;
          if (event.target.files.length > 0) {
            const uploadResult = await uploadProfileImage(memberId, event.target.files[0]);
            if (uploadResult.status === 'success') {
                // alert("done");
                showNotification(uploadResult.message, 'success');
              const imgElement = document.querySelector(`.profile-img-upload[data-member-id="${memberId}"]`);
              if (imgElement) {
                imgElement.src = uploadResult.data.profile_img + '?t=' + new Date().getTime();
              }
            }else{
                showNotification(uploadResult.message, 'error');
            }
          }
        });
      });
    };

    // Upload Profile Image
    const uploadProfileImage = async (userId, file) => {
      const formData = new FormData();
      formData.append('profile_img', file);
      formData.append('id', userId);

      try {
        const response = await fetch('admin_change_img.php', {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
          body: formData,
        });
        return await response.json();
      } catch (error) {
        console.error('Image Upload Error:', error); // Debugging: Log the error
        showNotification('Image upload error: ' + error.message, 'error');
        return { status: 'error', message: error.message };
      }
    };

    // Update Member
    const updateMember = async (memberId) => {
      try {
        const memberRow = document.querySelector(`tr[data-member-id="${memberId}"]`);
        if (!memberRow) {
          showNotification('Member row not found', 'error');
          return;
        }

        const updatedData = {
          id: memberId,
          first_name: memberRow.querySelector('input[data-field="first_name"]').value,
          last_name: memberRow.querySelector('input[data-field="last_name"]').value,
          phone: memberRow.querySelector('input[data-field="phone"]').value,
          email: memberRow.querySelector('input[data-field="email"]').value,
          role: memberRow.querySelector('select[data-field="role"]').value,
          room_id: memberRow.querySelector('select[data-field="room_id"]').value,
        };

        console.log('Updated Data:', updatedData); // Debugging: Log the updated data

        const response = await fetch('admin_update_member.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`,
          },
          body: JSON.stringify(updatedData),
        });

        const result = await response.json();
        if (result.status === 'success') {
          showNotification('Member updated successfully', 'success');
        } else {
          if (result.message === "invalid access token / unauthorized") {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login.html';
          }
          showNotification(result.message, 'error');
        }
      } catch (error) {
        console.error('Update Member Error:', error); // Debugging: Log the error
        showNotification('Error updating member: ' + error.message, 'error');
      }
    };

    // Delete Member
    const deleteMember = async (memberId) => {
      if (confirm('Are you sure you want to delete this member?')) {
        try {
          const response = await fetch('deleteMember.php', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`,
            },
            body: JSON.stringify({ id: memberId }),
          });

          const result = await response.json();
          if (result.status === 'success') {
            showNotification('Member deleted successfully', 'success');
            fetchMembers();
          } else {
            if (result.message === "invalid access token / unauthorized") {
              localStorage.removeItem('token');
              localStorage.removeItem('user');
              window.location.href = '/login.html';
            }
            showNotification(result.message, 'error');
          }
        } catch (error) {
          console.error('Delete Member Error:', error); // Debugging: Log the error
          showNotification('Error deleting member: ' + error.message, 'error');
        }
      }
    };

    // Event Listeners
    addMemberBtn.addEventListener('click', () => {
      addMemberForm.classList.toggle('hidden');
      membersTable.classList.toggle('hidden');
    });

    logoutButton.addEventListener('click', () => {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = '/login.html';
    });

    registerForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const formData = new FormData(registerForm);
      const data = Object.fromEntries(formData.entries());
    //   data.type = "admin";

      try {
        
        const response = await fetch('register.php', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`,
          },
          body: JSON.stringify(data),
        });

        const result = await response.json();
        
        if (result.status === 'success') {
          const imageInput = registerForm.querySelector('input[name="profile_img"]');
          if (imageInput.files.length > 0) {
            await uploadProfileImage(result.data.id, imageInput.files[0]);
          }
          showNotification(result.message, 'success');
          addMemberForm.classList.add('hidden');
          membersTable.classList.remove('hidden');
          fetchMembers();
          registerForm.reset();
        } else {
          if (result.message === "invalid access token / unauthorized") {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/login.html';
          }
          showNotification(result.message, 'error');
        }
      } catch (error) {
        console.error('Register Member Error:', error); // Debugging: Log the error
        showNotification('Error registering member: ' + error.message, 'error');
      }
      
    });

    // Initial Load
    fetchRooms(); // Fetch rooms once at the start
    fetchMembers(); // Fetch members after fetching rooms
    </script>
    </body>
    </html>
