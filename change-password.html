<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .header {
            background-color: #007bff;
            color: #fff;
            padding: 20px 0;
            text-align: center;
        }
        .header .logo {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .change-password-container {
            max-width: 800px;
            margin: auto;
            padding: 40px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 0 20px #007bff22;
            flex: 0 1 auto;
        }
        .change-password-container h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #007bff;
        }
        .form-group {
            position: relative;
            margin-bottom: 25px;
        }
      .form-control {
        width: 100%;
        height: 50px;
        padding: 10px 20px 10px 50px; /* Space for icon */
        font-size: 1rem;
        border-radius: 10px;
        border: 1px solid #ced4da;
        transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
         position: relative;
    }

      .form-control:focus {
          border-color: #007bff;
          box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
          outline: none;
      }
      .form-control::placeholder{
          transition: transform 0.3s ease, opacity 0.3s ease;

      }
      .form-control:focus::placeholder {
        transform: translateY(-150%);
        opacity: 0;
        transition: transform 0.4s ease, opacity 0.4s ease;
      }

        .form-group i {
            position: absolute;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            color: rgba(0, 123, 255, 0.5);
            z-index: 2;
            pointer-events: none;
        }
        .button-container {
            display: flex;
            flex-direction: column; /* Stack buttons vertically */
            gap: 10px;
        }

        .btn-change-password,
        .btn-cancel {
            padding: 10px;
            border: none;
            color: #fff;
            border-radius: 10px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease, opacity 0.3s ease;
            width: 100%; /* Full width */
        }


         .btn-change-password {
            background-color: #007bff;
        }
        .btn-cancel{
          background-color: #dc3545;
        }

        .btn-change-password:hover:not(:disabled) {
            background-color: #0056b3;
            transform: translateY(-2px);
        }
      .btn-cancel:hover:not(:disabled) {
            background-color: #c82333;
            transform: translateY(-2px);
        }
        .btn-change-password:disabled, .btn-cancel:disabled  {
            opacity: 0.65;
            cursor: default;
        }


        .footer {
            background-color: #007bff;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            margin-top: auto;
        }
       .alert-box {
           position: fixed;
           top: 20px;
           right: 20px;
           z-index: 1000;
       }
       .alert-success {
           background-color: #d4edda;
           border-color: #c3e6cb;
           color: #155724;
       }

       .alert-danger {
           background-color: #f8d7da;
           border-color: #f5c6cb;
           color: #721c24;
       }
       @keyframes fadeInUp {
           from {
               opacity: 0;
               transform: translateY(20px);
           }
           to {
               opacity: 1;
               transform: translateY(0);
           }
       }

       .form-group, .button-container, .btn-change-password, .btn-cancel {
           animation: fadeInUp 0.5s ease forwards;
           animation-delay: 0.2s;
       }
        .button-container{
          animation-delay: 0.4s;
        }
    </style>
</head>
<body>

<script>
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = '/login.html'; // Redirect to login if not logged in
    }
</script>

<header class="header">
    <div class="logo">Cafeteria</div>
</header>

<div class="change-password-container">
    <h2>Change Password</h2>
    <form id="changePasswordForm">
        <div class="form-group">
            <i class="fas fa-lock"></i>
            <input type="password" class="form-control" id="current_pass" placeholder="Enter current password" required>
        </div>

        <div class="form-group">
            <i class="fas fa-lock"></i>
            <input type="password" class="form-control" id="new_pass" placeholder="Enter new password" required>
        </div>

        <div class="form-group">
            <i class="fas fa-lock"></i>
            <input type="password" class="form-control" id="confirm_new_pass" placeholder="Confirm new password" required>
        </div>
      <div class="button-container">
        <button type="submit" class="btn btn-change-password">Change Password</button>
        <button type="button" class="btn btn-cancel" onclick="window.location.href='/dashboard.html'">Cancel</button>
      </div>
    </form>
</div>

<footer class="footer">
    <p>&copy; 2025 Cafeteria. All rights reserved.</p>
</footer>

<div id="notification" class="toast alert-box" role="alert" aria-live="assertive" aria-atomic="true" style="display: none;">
  <div class="toast-header">
    <strong class="me-auto">Notification</strong>
    <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
  </div>
  <div class="toast-body" id="notification-message"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
<script>
  function showNotification(message, type) {
    const notification = document.getElementById('notification');
    const notificationMessage = document.getElementById('notification-message');
    notification.style.display = 'block';

    const toastBody = notification.querySelector('.toast-body');
    toastBody.classList.remove('alert-success', 'alert-danger', 'alert-primary');

    if (type === 'success') {
        toastBody.classList.add('alert-success');
    } else if (type === 'danger') {
        toastBody.classList.add('alert-danger');
    } else {
        toastBody.classList.add('alert-primary');
    }

    notificationMessage.textContent = message;

    const toast = new bootstrap.Toast(notification)
    toast.show()
}
    document.getElementById('changePasswordForm').addEventListener('submit', function(event) {
        event.preventDefault();

        const currentPassword = document.getElementById('current_pass').value;
        const newPassword = document.getElementById('new_pass').value;
        const confirmNewPassword = document.getElementById('confirm_new_pass').value;
        const changePasswordButton = this.querySelector('.btn-change-password');

        if (newPassword !== confirmNewPassword) {
            showNotification('New passwords do not match.', 'danger');
            return;
        }

        changePasswordButton.disabled = true;
        changePasswordButton.textContent = 'Changing...';

        const data = {
            current_pass: currentPassword,
            new_pass: newPassword
        };
        const token = localStorage.getItem('token');

        fetch('./change_pass.php', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'AUTHORIZATION':  token
            },
            body: JSON.stringify(data)
        })
        .then(response => {
          if (!response.ok) {
             let errorMessage = `HTTP error! Status: ${response.status}`;
            if (response.status === 404){
              errorMessage = "Change password endpoint not found (404). Check your './change_pass.php' path.";
            } else if (response.status === 401 || response.status === 403){
               errorMessage = "Unauthorized to change password (401/403).  Check your token.";
            }
            else if (response.status === 500){
               errorMessage = "Server error during password change (500). Check your server logs.";
            }
              throw new Error(errorMessage);
          }
          return response.json();
        })
        .then(response => {
            if (response.status === 'success') {
                showNotification(response.message, 'success');
                 setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 2000);


            } else {
                showNotification(response.message, 'danger');
                 changePasswordButton.disabled = false;
                 changePasswordButton.textContent = 'Change Password';
            }
        })
        .catch(error => {
            console.error('Error:', error);
            showNotification(`An error occurred: ${error.message}`, 'danger');
            changePasswordButton.disabled = false;
            changePasswordButton.textContent = 'Change Password';
        }).finally(() => {
            if (!localStorage.getItem('token')){
                setTimeout(() => {
                  changePasswordButton.disabled = false;
                  changePasswordButton.textContent = 'Change Password';
                }, 3000);
              }

        });
    });
</script>
</body>
</html>
